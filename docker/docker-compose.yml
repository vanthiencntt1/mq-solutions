# Production / staging (00-CONG-NGHE-QUY-UOC mục 13). Biến môi trường để trong .env cạnh file này.
name: mq-solutions
services:
  nginx:
    image: nginx:stable
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads:/var/www/storage:ro # nginx phục vụ thẳng /uploads
    depends_on: [web]
  web:
    image: mq-solutions:${TAG:-latest}
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: .env
    environment: { HOSTNAME: 0.0.0.0, PORT: 3000, STORAGE_DIR: /app/storage }
    volumes: [uploads:/app/storage]
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    image: mq-solutions:${TAG:-latest}
    env_file: .env
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'worker/index.ts']
    environment: { STORAGE_DIR: /app/storage }
    volumes: [uploads:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
  migrate:
    image: mq-solutions:${TAG:-latest}
    env_file: .env
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:16
    env_file: .env.db
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
  uploads: # ảnh, tệp tải lên – nhớ sao lưu cùng database
