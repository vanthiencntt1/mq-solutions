# Nginx biên (00-CONG-NGHE-QUY-UOC mục 1): HTTPS, nén, giới hạn tần suất, chặn /admin ngoài whitelist.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream mq_web { server web:3000; }

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name mqsolutions.vn www.mqsolutions.vn admin.mqsolutions.vn;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 10m;

  # Tệp công khai lưu trên ổ đĩa server (volume uploads)
  location /uploads/ {
    alias /var/www/storage/public/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  location /admin {
    # allow 203.0.113.0/24;  # IP văn phòng / VPN
    # deny all;
    proxy_pass http://mq_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://mq_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://mq_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
